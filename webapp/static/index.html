<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DR Screening</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 20px 60px;
    background: #f6f8f7;
    color: #16213a;
  }
  header {
    padding: 28px 0 20px;
    border-bottom: 1px solid #e2e6e3;
    margin-bottom: 28px;
  }
  header h1 { font-size: 22px; font-weight: 700; margin: 0; color: #16213a; }
  header p { font-size: 13px; color: #5b6b66; margin: 4px 0 0; letter-spacing: 0.02em; text-transform: uppercase; }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 1px 3px rgba(20,30,28,0.06);
    margin-bottom: 20px;
  }

  input[type=file] { display: block; margin-bottom: 14px; font-size: 14px; }
  button {
    background: #1f6f5c;
    color: #fff;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #175346; }
  #backBtn { display: block; margin: 24px auto 0; background: #fff; color: #1f6f5c; border: 1.5px solid #1f6f5c; }
  #backBtn:hover { background: #eef5f2; }

  #status { margin-top: 14px; color: #5b6b66; font-size: 14px; }

  #resultsPage { display: none; }
  #resultsPage h2 { font-size: 19px; margin: 0 0 16px; }

  .referable { display: none; padding: 14px 16px; border-radius: 10px; font-weight: 700; margin-bottom: 12px; font-size: 15px; }
  .referable.yes { background: #fbeaea; color: #a23b2f; }
  .referable.no { background: #e6f3ee; color: #1f6f5c; }

  .review { display: none; padding: 12px 16px; border-radius: 10px; font-weight: 600; margin-bottom: 16px; background: #fdf3e3; color: #8a5a00; font-size: 13.5px; }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 8px;
  }
  .stat {
    background: #fbfcfb;
    border: 1px solid #e2e6e3;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat .label { font-size: 12px; color: #5b6b66; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .stat .value { font-size: 20px; font-weight: 700; color: #16213a; }
  .stat.wide { grid-column: 1 / -1; }

  .imgBlock { display: none; margin-top: 20px; }
  .imgBlock p { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: #5b6b66; margin: 0 0 8px; }
  .imgBlock img { width: 100%; height: auto; border-radius: 10px; display: block; }
</style>
</head>
<body>

<header>
  <h1>DR Screening</h1>
  <p>AI-assisted diabetic retinopathy detection</p>
</header>

<div id="uploadPage">
  <div class="card">
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="analyze()">Analyze</button>
    <div id="status"></div>
  </div>
</div>

<div id="resultsPage">
  <h2>Screening result</h2>
  <div id="referableBanner" class="referable"></div>
  <div id="reviewBanner" class="review"></div>

  <div class="card">
    <div class="stat-grid">
      <div class="stat"><div class="label">Quality</div><div class="value" id="rStatus"></div></div>
      <div class="stat"><div class="label">Quality score</div><div class="value" id="rScore"></div></div>
      <div class="stat" id="gradeRow"><div class="label">DR grade</div><div class="value" id="rGrade"></div></div>
      <div class="stat" id="confRow"><div class="label">Confidence</div><div class="value" id="rConf"></div></div>
      <div class="stat" id="maRow"><div class="label">Microaneurysms</div><div class="value" id="rMa"></div></div>
      <div class="stat" id="hemRow"><div class="label">Hemorrhages</div><div class="value" id="rHem"></div></div>
      <div class="stat wide" id="exRow"><div class="label">Exudates</div><div class="value" id="rEx"></div></div>
    </div>

    <div class="imgBlock" id="enhancedBlock">
      <p>Enhanced image</p>
      <img id="rImg">
    </div>

    <div class="imgBlock" id="gradcamBlock">
      <p>AI attention map (Grad-CAM)</p>
      <img id="rGradcam">
    </div>
  </div>

  <button id="backBtn" onclick="showUpload()">New scan</button>
</div>

<script>
const LOW_CONFIDENCE_THRESHOLD = 0.8;

function showUpload() {
  document.getElementById('resultsPage').style.display = 'none';
  document.getElementById('uploadPage').style.display = 'block';
  document.getElementById('imageInput').value = '';
}

async function analyze() {
  const fileInput = document.getElementById('imageInput');
  if (!fileInput.files.length) { alert('Select an image first'); return; }
  document.getElementById('status').innerText = 'Processing... (~30-60s)';

  const formData = new FormData();
  formData.append('image', fileInput.files[0]);

  try {
    const res = await fetch('/analyze', { method: 'POST', body: formData });
    const data = await res.json();
    document.getElementById('status').innerText = '';

    if (data.error) {
      document.getElementById('status').innerText = 'Error: ' + data.error;
      return;
    }

    document.getElementById('rStatus').innerText = data.status;
    document.getElementById('rScore').innerText = data.score + ' / 4';

    const hasGrade = data.grade !== undefined;
    ['gradeRow', 'confRow', 'maRow', 'hemRow', 'exRow'].forEach(id => {
      document.getElementById(id).style.display = hasGrade ? 'block' : 'none';
    });

    const banner = document.getElementById('referableBanner');
    const reviewBanner = document.getElementById('reviewBanner');

    if (hasGrade) {
      document.getElementById('rGrade').innerText = data.grade;
      document.getElementById('rConf').innerText = (data.confidence * 100).toFixed(1) + '%';
      document.getElementById('rMa').innerText = data.maCount;
      document.getElementById('rHem').innerText = data.hemCount;
      document.getElementById('rEx').innerText = data.exudateCount;

      const referable = data.grade >= 2;
      banner.className = 'referable ' + (referable ? 'yes' : 'no');
      banner.innerText = referable ? 'Referable DR — refer to ophthalmologist' : 'Not referable';
      banner.style.display = 'block';

      if (data.confidence < LOW_CONFIDENCE_THRESHOLD) {
        reviewBanner.innerText = '⚠ Low confidence — manual review recommended';
        reviewBanner.style.display = 'block';
      } else {
        reviewBanner.style.display = 'none';
      }
    } else {
      banner.style.display = 'none';
      reviewBanner.style.display = 'none';
    }

    const enhancedBlock = document.getElementById('enhancedBlock');
    if (data.enhanced_url) {
      document.getElementById('rImg').src = data.enhanced_url;
      enhancedBlock.style.display = 'block';
    } else {
      enhancedBlock.style.display = 'none';
    }

    const gradcamBlock = document.getElementById('gradcamBlock');
    if (data.gradcam_url) {
      document.getElementById('rGradcam').src = data.gradcam_url;
      gradcamBlock.style.display = 'block';
    } else {
      gradcamBlock.style.display = 'none';
    }

    document.getElementById('uploadPage').style.display = 'none';
    document.getElementById('resultsPage').style.display = 'block';
  } catch (err) {
    document.getElementById('status').innerText = 'Request failed: ' + err;
  }
}
</script>
</body>
</html>
