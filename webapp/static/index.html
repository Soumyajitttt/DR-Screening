<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DR Screening</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 60px auto; text-align: center; }
  button { margin-top: 12px; padding: 8px 20px; cursor: pointer; }
  #status { margin-top: 12px; color: #555; }
  #resultsPage { display: none; text-align: left; }
  #resultsPage h2 { text-align: center; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
  .label { font-weight: bold; }
  .referable { display: none; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin: 16px 0 8px; }
  .referable.yes { background: #fdecea; color: #b3261e; }
  .referable.no { background: #e6f4ea; color: #1e7b34; }
  .review { display: none; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin: 0 0 16px; background: #fff4e0; color: #8a5a00; }
  .imgBlock { display: none; margin-top: 20px; }
  .imgBlock p { text-align: center; font-weight: bold; margin-bottom: 6px; }
  .imgBlock img { width: 70%; border-radius: 6px; display: block; }
  #backBtn { display: block; margin: 20px auto 0; }
</style>
</head>
<body>

<div id="uploadPage">
  <h1>DR Screening — Demo</h1>
  <input type="file" id="imageInput" accept="image/*"><br>
  <button onclick="analyze()">Analyze</button>
  <div id="status"></div>
</div>

<div id="resultsPage">
  <h2>Screening Result</h2>
  <div id="referableBanner" class="referable"></div>
  <div id="reviewBanner" class="review"></div>
  <div class="row"><span class="label">Quality</span><span id="rStatus"></span></div>
  <div class="row"><span class="label">Quality Score</span><span id="rScore"></span></div>
  <div class="row" id="gradeRow"><span class="label">DR Grade</span><span id="rGrade"></span></div>
  <div class="row" id="confRow"><span class="label">Confidence</span><span id="rConf"></span></div>
  <div class="row" id="maRow"><span class="label">Microaneurysms</span><span id="rMa"></span></div>
  <div class="row" id="hemRow"><span class="label">Hemorrhages</span><span id="rHem"></span></div>
  <div class="row" id="exRow"><span class="label">Exudates</span><span id="rEx"></span></div>

  <div class="imgBlock" id="enhancedBlock">
    <p>Enhanced Image</p>
    <img id="rImg">
  </div>

  <div class="imgBlock" id="gradcamBlock">
    <p>AI Attention Map (Grad-CAM)</p>
    <img id="rGradcam">
  </div>

  <button id="backBtn" onclick="showUpload()">New Scan</button>
</div>

<script>
const LOW_CONFIDENCE_THRESHOLD = 0.8;

function showUpload() {
  document.getElementById('resultsPage').style.display = 'none';
  document.getElementById('uploadPage').style.display = 'block';
  document.getElementById('imageInput').value = '';
}

async function analyze() {
  const fileInput = document.getElementById('imageInput');
  if (!fileInput.files.length) { alert('Select an image first'); return; }
  document.getElementById('status').innerText = 'Processing... (~30-60s)';

  const formData = new FormData();
  formData.append('image', fileInput.files[0]);

  try {
    const res = await fetch('/analyze', { method: 'POST', body: formData });
    const data = await res.json();
    document.getElementById('status').innerText = '';

    if (data.error) {
      document.getElementById('status').innerText = 'Error: ' + data.error;
      return;
    }

    document.getElementById('rStatus').innerText = data.status;
    document.getElementById('rScore').innerText = data.score + ' / 4';

    const hasGrade = data.grade !== undefined;
    ['gradeRow', 'confRow', 'maRow', 'hemRow', 'exRow'].forEach(id => {
      document.getElementById(id).style.display = hasGrade ? 'flex' : 'none';
    });

    const banner = document.getElementById('referableBanner');
    const reviewBanner = document.getElementById('reviewBanner');

    if (hasGrade) {
      document.getElementById('rGrade').innerText = data.grade;
      document.getElementById('rConf').innerText = (data.confidence * 100).toFixed(1) + '%';
      document.getElementById('rMa').innerText = data.maCount;
      document.getElementById('rHem').innerText = data.hemCount;
      document.getElementById('rEx').innerText = data.exudateCount;

      const referable = data.grade >= 2;
      banner.className = 'referable ' + (referable ? 'yes' : 'no');
      banner.innerText = referable ? 'Referable DR — refer to ophthalmologist' : 'Not referable';
      banner.style.display = 'block';

      if (data.confidence < LOW_CONFIDENCE_THRESHOLD) {
        reviewBanner.innerText = '⚠️ Low confidence — manual review recommended';
        reviewBanner.style.display = 'block';
      } else {
        reviewBanner.style.display = 'none';
      }
    } else {
      banner.style.display = 'none';
      reviewBanner.style.display = 'none';
    }

    const enhancedBlock = document.getElementById('enhancedBlock');
    if (data.enhanced_url) {
      document.getElementById('rImg').src = data.enhanced_url;
      enhancedBlock.style.display = 'block';
    } else {
      enhancedBlock.style.display = 'none';
    }

    const gradcamBlock = document.getElementById('gradcamBlock');
    if (data.gradcam_url) {
      document.getElementById('rGradcam').src = data.gradcam_url;
      gradcamBlock.style.display = 'block';
    } else {
      gradcamBlock.style.display = 'none';
    }

    document.getElementById('uploadPage').style.display = 'none';
    document.getElementById('resultsPage').style.display = 'block';
  } catch (err) {
    document.getElementById('status').innerText = 'Request failed: ' + err;
  }
}
</script>
</body>
</html>
